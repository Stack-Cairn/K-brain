name: SSH manager tests

on:
  pull_request:
    paths:
      - 'internal/sshhosts/**'
      - 'internal/sshmgr/**'
      - 'internal/elicit/**'
      - 'internal/backend/**'
      - 'internal/tools/**'
      - 'internal/protocol/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ssh-manager-tests.yml'
  push:
    branches: [main]
    paths:
      - 'internal/sshhosts/**'
      - 'internal/sshmgr/**'
      - 'internal/elicit/**'
      - 'internal/backend/**'
      - 'internal/tools/**'
      - 'internal/protocol/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ssh-manager-tests.yml'

permissions:
  contents: read

jobs:
  ssh-manager:
    name: SSH manager (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Preserve committed LF on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/sshhosts ./internal/sshmgr/... ./internal/tools ./internal/backend
      # Every SSH test talks to an in-process server on 127.0.0.1 with
      # throwaway keys and a temporary HOME; nothing reaches a real host.
      - run: go test -race ./internal/sshhosts ./internal/sshmgr/... -count=1 -timeout=10m
      - run: go test -race ./internal/backend -run "SSH" -count=1 -timeout=10m
      - run: go test -race ./internal/tools -run "SSHManager" -count=1 -timeout=5m
      - run: go test ./internal/protocol -count=1
