name: Sandbox tests

on:
  pull_request:
    paths:
      - 'internal/sandbox/**'
      - 'internal/backend/run_sandbox*.go'
      - 'internal/backend/sandbox_setup*.go'
      - 'cmd/kn/sandbox*.go'
      - 'internal/tools/bashrun/**'
      - 'internal/process/**'
      - 'internal/tools/result_meta.go'
      - 'internal/tools/sandbox_denial_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sandbox-tests.yml'
  push:
    branches: [main]
    paths:
      - 'internal/sandbox/**'
      - 'internal/backend/run_sandbox*.go'
      - 'internal/backend/sandbox_setup*.go'
      - 'cmd/kn/sandbox*.go'
      - 'internal/tools/bashrun/**'
      - 'internal/process/**'
      - 'internal/tools/result_meta.go'
      - 'internal/tools/sandbox_denial_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sandbox-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    name: Sandbox (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve committed LF on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet for every sandbox target
        shell: bash
        run: |
          go vet ./internal/sandbox/...
          GOOS=linux GOARCH=amd64 go vet ./internal/sandbox/...
          GOOS=linux GOARCH=arm64 go vet ./internal/sandbox/...
          GOOS=darwin go vet ./internal/sandbox/...
          GOOS=windows go build ./...
          GOOS=windows go vet ./internal/sandbox/... ./internal/process/ ./internal/tools/bashrun/
      - name: Linux kernel and Landlock
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
          command -v bwrap || echo "bwrap is not installed"
      # Without a usable bubblewrap the probe falls back to Landlock, so the
      # generic live tests exercise that path too. KBRAIN_REQUIRE_LANDLOCK turns
      # a skipped Landlock test into a failure.
      - name: Linux tests on the Landlock fallback
        if: runner.os == 'Linux'
        shell: bash
        env:
          KBRAIN_REQUIRE_LANDLOCK: '1'
          KBRAIN_EXPECT_SANDBOX_MECHANISM: landlock
        run: |
          # Hide a preinstalled bubblewrap so the fallback is what runs. With a
          # merged /usr, /bin/bwrap and /usr/bin/bwrap are the same file, so
          # resolve and de-duplicate before moving.
          hidden=$({ which -a bwrap 2>/dev/null || true; } | xargs -r -n1 readlink -f | sort -u)
          for b in $hidden; do sudo mv "$b" "$b.hidden"; done
          if command -v bwrap >/dev/null; then echo "bubblewrap still on PATH: $(command -v bwrap)"; exit 1; fi
          set +e
          go test ./internal/sandbox/... -count=1 -v
          status=$?
          go test ./internal/tools/ -run '^TestShellToolsExplainSandboxDenials$' -count=1 -v || status=1
          for b in $hidden; do sudo mv "$b.hidden" "$b"; done
          exit $status
      - name: Linux tests with bubblewrap
        if: runner.os == 'Linux'
        shell: bash
        env:
          KBRAIN_REQUIRE_LANDLOCK: '1'
          KBRAIN_EXPECT_SANDBOX_MECHANISM: bubblewrap
        run: |
          command -v bwrap >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }
          # Ubuntu restricts unprivileged user namespaces through AppArmor.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          go test ./internal/sandbox/... ./internal/tools/bashrun/... -count=1 -v
          go test ./internal/tools/ -run '^TestShellToolsExplainSandboxDenials$' -count=1 -v
          go test ./internal/backend/ -run 'Sandbox|Health' -count=1
      - name: macOS tests
        if: runner.os == 'macOS'
        run: |
          go test ./internal/sandbox/... ./internal/tools/bashrun/... -count=1 -v
          go test ./internal/tools/ -run '^TestShellToolsExplainSandboxDenials$' -count=1 -v
          go test ./internal/backend/ -run 'Sandbox|Health' -count=1
      - name: Windows tests
        if: runner.os == 'Windows'
        run: go test ./internal/sandbox/... -count=1 -v
      - name: Windows sandboxed shell commands
        if: runner.os == 'Windows'
        run: go test ./internal/tools/bashrun/ ./internal/process/ -count=1 -v -run "Sandbox|Process"
      - name: Windows backend and CLI
        if: runner.os == 'Windows'
        run: |
          go test ./internal/backend/ -run 'Sandbox|Health' -count=1
          go test ./cmd/kn/ -run 'SandboxCLI' -count=1 -v
      # GitHub's Windows runners are elevated, so the sandbox-user cycle runs
      # for real: setup, confined runs, uninstall. The test accounts use the
      # KBrainTst- prefix and a temporary data directory. The step fails if
      # the test was skipped.
      - name: Windows sandbox-user administrator cycle
        if: runner.os == 'Windows'
        shell: bash
        env:
          KBRAIN_WINDOWS_ADMIN_TESTS: '1'
        run: |
          set -o pipefail
          go test ./internal/sandbox/ -run '^(TestWindowsSandboxUserAdminCycle|TestWindowsCapability)$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/admin-cycle.log"
          grep -q -- '--- PASS: TestWindowsSandboxUserAdminCycle' "$RUNNER_TEMP/admin-cycle.log"
      - name: Windows leftovers after uninstall
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $users = @(Get-LocalUser | Where-Object Name -like 'KBrainTst-*')
          $groups = @(Get-LocalGroup | Where-Object Name -like 'KBrainTst-*')
          $filters = @(netsh wfp show filters file=- | Select-String 'K-brain')
          "users: $($users.Count) groups: $($groups.Count) filters: $($filters.Count)"
          if ($users.Count -or $groups.Count -or $filters.Count) { $users; $groups; $filters; exit 1 }
