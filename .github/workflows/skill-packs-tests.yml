name: Skill pack tests

on:
  pull_request:
    paths:
      - 'internal/skills/**'
      - 'internal/backend/**'
      - 'internal/tui/**'
      - 'internal/prompts/**'
      - 'internal/protocol/**'
      - 'cmd/kn/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/skill-packs-tests.yml'
  push:
    branches: [main]
    paths:
      - 'internal/skills/**'
      - 'internal/backend/**'
      - 'internal/tui/**'
      - 'internal/prompts/**'
      - 'internal/protocol/**'
      - 'cmd/kn/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/skill-packs-tests.yml'

permissions:
  contents: read

jobs:
  skill-packs:
    name: Skill packs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Preserve committed LF on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/skills ./internal/backend ./internal/tui ./cmd/kn
      - run: go test -race ./internal/skills ./internal/prompts -count=1 -timeout=10m
      - run: go test -race ./internal/backend -run "^Test(SkillsHTTP|RunReadRoots|Health)" -count=1 -timeout=10m
      - run: go test -race ./internal/tui -run "^Test(SkillPack|SkillSurface|Extensions)" -count=1 -timeout=10m
      - run: go test ./internal/protocol -count=1
