name: Background tool tests

on:
  pull_request:
    paths:
      - 'internal/tools/**'
      - 'internal/process/**'
      - 'internal/agent/**'
      - 'internal/backend/**'
      - 'internal/tui/**'
      - 'internal/protocol/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/background-tool-tests.yml'
  push:
    branches: [main]
    paths:
      - 'internal/tools/**'
      - 'internal/process/**'
      - 'internal/agent/**'
      - 'internal/backend/**'
      - 'internal/tui/**'
      - 'internal/protocol/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/background-tool-tests.yml'

permissions:
  contents: read

jobs:
  background-tool:
    name: Background tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Preserve committed LF on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/tools/... ./internal/agent ./internal/backend ./internal/tui
      - run: go test -race ./internal/tools/bashrun -run "Detach" -count=1 -timeout=10m
      - run: go test -race ./internal/tools -run "^Test(Background|StopBackgrounded)" -count=1 -timeout=10m
      - run: go test -race ./internal/backend -run "^Test(BackgroundToolEndpoint|CloseSessionStopsBackgroundedCommand)$" -count=1 -timeout=10m
      - run: go test -race ./internal/tui -run "^Test(CtrlB|ToolBackground|Keymap)" -count=1 -timeout=10m
      - run: go test ./internal/protocol -count=1
